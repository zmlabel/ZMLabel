<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Signup | ZM LABEL</title>

<link
    rel="stylesheet"
    href="login.css"
>

<link
    rel="icon"
    type="image/x-icon"
    href="favicon.ico"
>

</head>


<body>


<div class="login-box">


    <h1>
        Create Account
    </h1>


    <!-- FULL NAME -->

    <input
        type="text"
        id="signupName"
        placeholder="Full Name"
        autocomplete="name"
    >


    <!-- EMAIL -->

    <input
        type="email"
        id="signupEmail"
        placeholder="Email Address"
        autocomplete="email"
    >


    <!-- WHATSAPP -->

    <input
        type="tel"
        id="signupPhone"
        placeholder="WhatsApp Number"
        autocomplete="tel"
        inputmode="tel"
    >


    <!-- PASSWORD -->

    <div class="password-box">

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            autocomplete="new-password"
        >

        <i
            class="ri-eye-line"
            id="toggleSignupPassword"
        ></i>

    </div>


    <!-- CREATE ACCOUNT -->

    <button
        id="signupBtn"
        type="button"
    >
        Create Account
    </button>


    <p>

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>


</div>


<script src="config.js"></script>

<script src="auth.js"></script>


</body>

</html>
