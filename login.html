<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login | ZM LABEL</title>

<link rel="stylesheet" href="login.css">

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
>

<link
    rel="icon"
    type="image/x-icon"
    href="favicon.ico"
>

</head>

<body>

<div class="login-box">

    <h1>
        Welcome Back
    </h1>


    <!-- EMAIL -->

    <input
        type="email"
        id="loginEmail"
        placeholder="Email Address"
        autocomplete="email"
    >


    <!-- WHATSAPP NUMBER -->

    <input
        type="tel"
        id="loginPhone"
        placeholder="WhatsApp Number"
        autocomplete="tel"
    >


    <!-- PASSWORD -->

    <div class="password-box">

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            autocomplete="current-password"
        >

        <i
            class="ri-eye-line"
            id="togglePassword"
        ></i>

    </div>


    <!-- LOGIN -->

    <button
        id="loginBtn"
        type="button"
    >
        Login
    </button>


    <!-- FORGOT PASSWORD -->

    <p class="forgot-link">

        <a href="forgot-password.html">
            Forgot Password?
        </a>

    </p>


    <!-- CREATE ACCOUNT -->

    <p>

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </p>

</div>


<script src="config.js"></script>

<script src="auth.js"></script>

</body>

</html>
